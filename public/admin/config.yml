# Sveltia CMS config.
# The CMS works on `staging`, NOT on `main`.
#
# Netlify bills for every production deploy, and Sveltia commits each upload
# and each save separately — one editing session produced 58 deploys and burned
# 870 of 1,000 monthly credits. Pointing the CMS at `staging` means Jacob can
# upload and edit as much as he likes for free; nothing reaches the live site
# until the Publish action runs and fast-forwards `main` (one deploy, one
# batch). See .github/workflows/publish.yml.
#
# NOTE: Sveltia does NOT support `publish_mode: editorial_workflow` — the docs
# say it's "not yet supported... will be added before the 1.0 release", so
# setting it here would be silently ignored. This branch IS the staging area.
backend:
  name: github
  repo: BARRELLABS/jcwrks-portfolio
  branch: staging

# local testing: npx @sveltia/cms-server  (or npx decap-server)
local_backend: true

media_folder: public/galleries
public_folder: /galleries

# Shrink photos IN THE BROWSER, before they're uploaded.
#
# Jacob uploads straight off the camera (~8MB a shot). Sveltia base64-encodes
# the file into a GitHub API request, so an 8MB photo becomes a ~10.7MB request
# — slow, and it sometimes fails silently, which is why uploads occasionally
# never showed up at all. Transforming first means ~300KB leaves his machine
# instead of 8MB, so there's nothing left to choke on.
#
# 2000px deliberately matches MAX_EDGE in scripts/optimize-images.mjs, so the
# build-time optimizer sees an already-correct file and leaves it alone.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2000
        height: 2000

collections:
  - name: settings
    label: Site Numbers
    files:
      - name: stats
        label: "\"Moments Captured\" counter"
        file: src/data/stats.json
        description: >-
          The big number at the bottom of the site. By default it just counts
          the photos uploaded here, which is only a slice of what you've
          actually shot — put your real total in and it'll use that instead.
        fields:
          - label: Total photos you've taken
            name: photosTaken
            widget: number
            value_type: int
            min: 0
            default: 0
            required: false
            hint: >-
              Your best honest estimate across every shoot, career-wide. Leave
              it at 0 to just count the photos on the site.

  - name: galleries
    label: Photo Galleries
    label_singular: Gallery
    description: Pick a gallery, set its cover photo, then add or remove photos.
    files:
      - name: sports
        label: Sports (main tile cover)
        file: src/data/galleries/sports.json
        media_folder: /public/galleries/sports
        public_folder: /galleries/sports
        fields:
          - { label: Cover photo (the Sports tile image), name: cover, widget: image, required: false, choose_url: false }
      - name: basketball
        label: Basketball
        file: src/data/galleries/basketball.json
        media_folder: /public/galleries/basketball
        public_folder: /galleries/basketball
        fields:
          - { label: Cover photo (the tile image), name: cover, widget: image, required: false, choose_url: false }
          - label: Photos
            name: images
            widget: list
            label_singular: Photo
            # Show the filename, not the caption — captions are usually empty,
            # which made every row in the list render blank and unidentifiable.
            summary: "{{fields.src}}"
            required: false
            fields:
              - { label: Photo, name: src, widget: image, choose_url: false }
              - { label: Caption (optional), name: alt, widget: string, required: false }
      - name: football
        label: Football
        file: src/data/galleries/football.json

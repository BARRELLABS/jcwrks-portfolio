# Sveltia CMS config.
# After deploy: set `repo` to the GitHub repo, then Jacob logs in at /admin with GitHub.
backend:
  name: github
  repo: BARRELLABS/jcwrks-portfolio
  branch: main

# Lets you test the CMS locally with:  npx @sveltia/cms-server   (or  npx decap-server)
local_backend: true

media_folder: public/galleries
public_folder: /galleries

collections:
  - name: galleries
    label: Photo Galleries
    label_singular: Gallery
    description: Pick a gallery, then add or remove photos.
    files:
      - name: basketball
        label: Basketball
        file: src/data/galleries/basketball.json
        media_folder: /public/galleries/basketball
        public_folder: /galleries/basketball
        fields:
          - label: Photos
            name: images
            widget: list
            label_singular: Photo
            summary: "{{fields.alt}}"
            fields:
              - { label: Photo, name: src, widget: image, choose_url: false }
              - { label: Caption (optional), name: alt, widget: string, required: false }
      - name: football
        label: Football
        file: src/data/galleries/football.json

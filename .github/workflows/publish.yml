# Publishes everything Jacob has staged, as ONE production deploy.
#
# The CMS commits to `staging`, which Netlify never builds. This is the only
# thing that moves `main`, so it is the only thing that costs a deploy.
# However many photos and edits are waiting, publishing them is one deploy.
#
# Run it from:
#   https://github.com/BARRELLABS/jcwrks-portfolio/actions/workflows/publish.yml
#   -> "Run workflow" -> green button

name: Publish site

on:
  workflow_dispatch:

# Never let two publishes race each other onto main.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # need real history to merge staging in

      - name: Publish staging to main
        run: |
          git config user.name "jcwrks bot"
          git config user.email "bot@jcwrks.local"
          git fetch origin staging

          if git diff --quiet main origin/staging; then
            echo "Nothing to publish — the live site already matches staging."
            exit 0
          fi

          echo "Publishing these changes:"
          git diff --stat main origin/staging

          # staging is normally just main plus Jacob's edits, so this
          # fast-forwards. If main moved on its own (a code change), fall back
          # to a real merge rather than failing.
          git merge --ff-only origin/staging || git merge --no-edit origin/staging

          git push origin main
          echo "Published. Netlify will build once and the site goes live in a minute or two."

          # Keep staging level with main.
          #
          # sync-staging.yml can't do it here: GitHub deliberately does not fire
          # workflows for pushes made with GITHUB_TOKEN, so the push above
          # triggers nothing. After a fast-forward the branches already match,
          # but if the merge above created a merge commit then main is ahead and
          # staging would sit behind until someone pushed by hand.
          #
          # Rejected if Jacob uploaded while this ran — that's the point, it
          # refuses rather than clobbering his work, and the next publish
          # reconciles it.
          git push origin main:staging || echo "staging has newer work of its own — leaving it alone."

# Shrinks photos after they're uploaded through the CMS.
#
# Why: Jacob uploads straight off the camera (~8MB a shot). The site itself is
# fine — the build shrinks images before serving them — but that only affects
# Netlify's throwaway copy. The REPO keeps every full-res original forever, and
# Netlify re-clones + re-optimizes all of them on every single deploy. Left
# alone that ends in a multi-GB repo and builds that time out.
#
# So: when a photo lands in public/galleries, shrink it in place and commit the
# smaller version back. Uses the same scripts/optimize-images.mjs the build runs,
# so there's one set of rules (2000px long edge, ~600KB threshold, q82 mozjpeg).

name: Shrink uploaded photos

on:
  push:
    branches: [staging] # the CMS works on staging, so uploads land there
    paths:
      - "public/galleries/**"
  # Lets you sweep every gallery on demand from the Actions tab, and gives a way
  # to test the job without pushing a big photo just to trigger it.
  workflow_dispatch:

# Two uploads in quick succession would otherwise race to push.
concurrency:
  group: shrink-photos
  cancel-in-progress: false

jobs:
  shrink:
    # Don't retrigger on our own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Only sharp is needed — not the whole site toolchain.
      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp

      - name: Shrink oversized images
        run: node scripts/optimize-images.mjs

      # Turn uploaded files into real entries in the gallery JSON, so they show
      # up in the CMS as rows Jacob can drag to reorder or caption. Renders
      # identically either way — src/lib/galleries.ts already appends whatever
      # is on disk — so this changes the CMS, not the site.
      - name: Index uploaded photos into the galleries
        run: node scripts/sync-galleries.mjs

      - name: Commit the smaller versions
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Everything already within size limits — nothing to do."
            exit 0
          fi

          git config user.name "jcwrks bot"
          git config user.email "bot@jcwrks.local"
          git add -A

          # Deliberately NO "[skip ci]" here any more.
          #
          # It used to be needed because this ran on main. Now it runs on
          # staging, which Netlify never builds, so it buys nothing — and it
          # would actively break publishing: publish fast-forwards main to the
          # tip of staging, and if that tip carried [skip ci], Netlify would
          # skip the one build that is supposed to put the batch live.
          git commit -m "Shrink and index uploaded photos"

          # Jacob may well have uploaded again while this was running.
          git pull --rebase
          git push

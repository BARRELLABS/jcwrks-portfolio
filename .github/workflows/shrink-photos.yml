# Shrinks photos after they're uploaded through the CMS.
#
# Why: Jacob uploads straight off the camera (~8MB a shot). The site itself is
# fine — the build shrinks images before serving them — but that only affects
# Netlify's throwaway copy. The REPO keeps every full-res original forever, and
# Netlify re-clones + re-optimizes all of them on every single deploy. Left
# alone that ends in a multi-GB repo and builds that time out.
#
# So: when a photo lands in public/galleries, shrink it in place and commit the
# smaller version back. Uses the same scripts/optimize-images.mjs the build runs,
# so there's one set of rules (2000px long edge, ~600KB threshold, q82 mozjpeg).

name: Shrink uploaded photos

on:
  push:
    branches: [main]
    paths:
      - "public/galleries/**"
  # Lets you sweep every gallery on demand from the Actions tab, and gives a way
  # to test the job without pushing a big photo just to trigger it.
  workflow_dispatch:

# Two uploads in quick succession would otherwise race to push.
concurrency:
  group: shrink-photos
  cancel-in-progress: false

jobs:
  shrink:
    # Don't retrigger on our own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Only sharp is needed — not the whole site toolchain.
      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp

      - name: Shrink oversized images
        run: node scripts/optimize-images.mjs

      - name: Commit the smaller versions
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Everything already within size limits — nothing to do."
            exit 0
          fi

          git config user.name "jcwrks bot"
          git config user.email "bot@jcwrks.local"
          git add -A

          # [skip ci] on purpose: Netlify already deployed this photo, and it
          # served the optimized version. The shrunk original renders
          # identically, so a second deploy would just burn build minutes.
          git commit -m "Shrink uploaded photos [skip ci]"

          # Jacob's CMS pushes to main too — rebase in case he uploaded again
          # while this was running.
          git pull --rebase
          git push

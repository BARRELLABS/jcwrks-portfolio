# Keeps `staging` caught up with `main`.
#
# `staging` is where the CMS works, so it must never drift behind the code on
# `main` — otherwise a later publish would drag stale code back over the live
# site. This runs after anything lands on main (a publish, or a code change)
# and brings staging level again.
#
# No loop risk: this only triggers on main, and it only ever pushes to staging.

name: Sync staging with main

on:
  push:
    branches: [main]

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - name: Bring staging up to date
        run: |
          git config user.name "jcwrks bot"
          git config user.email "bot@jcwrks.local"
          git fetch origin main

          if git merge-base --is-ancestor origin/main staging; then
            echo "staging already contains main — nothing to do."
            exit 0
          fi

          # Usually a fast-forward (right after a publish). If Jacob has edits
          # staged that aren't live yet, merge so his work is preserved.
          git merge --ff-only origin/main || git merge --no-edit origin/main

          git push origin staging
          echo "staging is level with main."

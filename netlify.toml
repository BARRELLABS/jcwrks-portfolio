[build]
  command = "npm run build"
  publish = "dist"
  # Only ever build the production branch.
  #
  # Every build Netlify runs is a billed production deploy. The CMS used to
  # commit each upload straight to `main`, so a single editing session could
  # fire off 40+ of them. Jacob's edits now land on `staging` and are published
  # deliberately (see .github/workflows/publish.yml).
  #
  # This is belt-and-braces: even if branch deploys or deploy previews get
  # turned on in the Netlify UI later, anything that isn't `main` is skipped
  # here. exit 0 = skip the build, exit 1 = go ahead and build.
  #
  # Deliberately FAILS OPEN. If BRANCH and CONTEXT are both empty — because
  # they aren't populated in the ignore step, or Netlify changes them — we
  # build rather than skip. Getting that backwards would silently wedge the
  # site so it could never deploy again, which is far worse than one surplus
  # build. The echo puts the values in the deploy log so this is debuggable.
  ignore = 'echo "ignore-check BRANCH=$BRANCH CONTEXT=$CONTEXT"; if [ "$BRANCH" = "main" ] || [ "$CONTEXT" = "production" ] || [ -z "$BRANCH$CONTEXT" ]; then exit 1; fi; exit 0'

[build.environment]
  NODE_VERSION = "22"

# Pretty 404s
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
